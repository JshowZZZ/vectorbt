[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorbt"
dynamic = ["version"]
description = "Python library for backtesting and analyzing trading strategies at scale"
readme = "README.md"
license-files = ["LICENSE.md"]
authors = [
    {name = "Oleg Polakow", email = "olegpolakow@vectorbt.pro"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.23,<2.4",
    "pandas>=2.0,<3.0",
    "scipy",
    "matplotlib",
    "plotly>=4.12.0",
    "ipywidgets>=7.0.0",
    "anywidget",
    "numba>=0.60,<0.64",
    "dill",
    "tqdm",
    "dateparser",
    "imageio",
    "scikit-learn",
    "schedule",
    "requests",
    "pytz",
    "mypy_extensions",
]

[project.optional-dependencies]
bridge = [
    "pyarrow",
]
full = [
    "pyarrow",
    "yfinance>=0.2.22",
    "python-binance",
    "ccxt>=4.0.14",
    "alpaca-py",
    "ray>=1.4.1",
    "ta",
    "pandas-ta-classic",
    "TA-Lib",
    "python-telegram-bot>=13.4,<20.0",
    "quantstats>=0.0.37",
]
full-no-talib = [
    "pyarrow",
    "yfinance>=0.2.22",
    "python-binance",
    "ccxt>=4.0.14",
    "alpaca-py",
    "ray>=1.4.1",
    "ta",
    "pandas-ta-classic",
    "python-telegram-bot>=13.4,<20.0",
    "quantstats>=0.0.37",
]
cov = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "codecov",
]
docs = [
    "mkdocs-material",
    "mkdocs-minify-plugin",
    "ruamel.yaml",
    "mako"
]

[project.urls]
Homepage = "https://github.com/polakowo/vectorbt"

[tool.setuptools.dynamic]
version = {attr = "vectorbt._version.__version__"}

[tool.setuptools.packages.find]
include = ["vectorbt*", "autowfo*"]

[tool.setuptools.package-data]
vectorbt = ["templates/*.json"]
autowfo = [
    "control_panel/static/*.html",
    "control_panel/static/favicon.svg",
    "control_panel/static/css/*.css",
    "control_panel/static/js/*.js",
    "control_panel/static_legacy/*.html",
    "control_panel/static_legacy/css/*.css",
    "control_panel/static_legacy/js/*.js",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow",
]
filterwarnings = [
    "ignore:.*websockets\\.WebSocketClientProtocol is deprecated.*:DeprecationWarning:binance\\..*",
    "ignore:.*websockets\\.WebSocketClientProtocol is deprecated.*:DeprecationWarning:websockets\\.imports",
    "ignore:.*websockets\\.legacy is deprecated.*:DeprecationWarning:websockets\\..*",
    "ignore:.*'imghdr' is deprecated.*:DeprecationWarning:telegram\\..*",
    "ignore:.*`local_mode` is an experimental feature.*:FutureWarning:ray\\..*",
    "ignore:.*RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO.*:FutureWarning:ray\\..*",
    "ignore:.*unclosed file.*:ResourceWarning:ray\\..*",
    "ignore:.*ChainedAssignmentError.*:FutureWarning:pandas_ta_classic\\..*",
    "ignore:.*DataFrame\\.swapaxes.*:FutureWarning:numpy\\._core\\.fromnumeric",
    "ignore::ImportWarning:importlib\\._bootstrap",
    "ignore::ImportWarning:importlib\\._bootstrap_external",
]
