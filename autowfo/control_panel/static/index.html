<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUTOWFO Control Panel</title>
  <meta name="description" content="AUTOWFO strategy operations console for monitoring runs, reviewing results, and driving the next action." />
  <meta name="theme-color" content="#0f172a" />
  <meta name="color-scheme" content="dark light" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="shortcut icon" href="/favicon.ico" />

  <!-- Keep the console signal clean until a local Tailwind build pipeline exists. -->
  <script>
    (function () {
      const originalWarn = console.warn.bind(console)
      console.warn = function (...args) {
        const message = String(args[0] || '')
        if (message.includes('cdn.tailwindcss.com should not be used in production')) {
          return
        }
        originalWarn(...args)
      }
    })()
  </script>

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            profit: '#10b981',
            loss:   '#ef4444',
            warn:   '#f59e0b',
          },
          fontFamily: {
            sans: ['Space Grotesk', 'Noto Sans TC', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
          },
        },
      },
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>

  <!-- App CSS (design system) -->
  <link rel="stylesheet" href="/static/css/app.css" />

  <!-- Vue 3 importmap -->
  <script type="importmap">
  {
    "imports": {
      "vue": "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js"
    }
  }
  </script>

  <style>
    /* Cfg input shared class */
    .cfg-input {
      display: block;
      width: 100%;
      padding: 0.375rem 0.625rem;
      font-size: 0.75rem;
      line-height: 1.25rem;
      border-radius: 0.5rem;
      border: 1px solid;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .cfg-input {
      background-color: #fff; border-color: #d1d5db; color: #374151;
    }
    .cfg-input:focus {
      border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15);
    }
    .dark .cfg-input {
      background-color: #0d1117; border-color: #30363d; color: #e5e7eb;
    }
    .dark .cfg-input:focus {
      border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.25);
    }
    .cfg-input:disabled {
      opacity: 0.5; cursor: not-allowed;
    }
    select.cfg-input {
      appearance: auto; width: auto; min-width: 6rem;
    }
    /* Smooth page transitions */
    [v-cloak] { display: none !important; }
  </style>
</head>
<body class="font-sans antialiased">
  <div id="app" v-cloak></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
